<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bug Hunter</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:sans-serif;min-height:100vh;display:flex;align-items:center;
         justify-content:center;background:#0f0f1a;color:#e8e8f0;padding:24px}
    .card{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:16px;
          padding:32px;max-width:480px;width:100%;text-align:center}
    .icon{font-size:48px;margin-bottom:16px}
    h2{font-size:20px;margin-bottom:10px;color:#6c63ff}
    p{color:#9090a8;font-size:14px;line-height:1.6}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📱</div>
    <h2>Could not load the page.</h2>
    <p>Check your internet connection and reopen the app.</p>
    <p style="margin-top:16px;font-size:12px;color:#5a5a72">Built with APK Forge</p>
  </div>
</body>
</html>
